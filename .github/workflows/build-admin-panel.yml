name: Build Admin Panel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare admin panel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          mkdir -p dist/admin
          sed -e "s#__SUPABASE_URL__#${SUPABASE_URL//\/\\/}#g" -e "s#__SUPABASE_PUBLISHABLE_KEY__#${SUPABASE_PUBLISHABLE_KEY//\/\\/}#g" admin/index.html > dist/admin/index.html
      - name: Upload admin panel
        uses: actions/upload-artifact@v4
        with:
          name: Cronograma-de-Estudos-APP-ADMIN-PANEL
          path: dist/admin/index.html
