name: Build Cronograma de Estudo APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare HTML asset
        run: |
          mkdir -p android/app/src/main/assets
          curl -L --fail https://raw.githubusercontent.com/residencia270med/residencia270-pwa/main/index.html -o android/app/src/main/assets/cronograma.html
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cronograma-de-Estudo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
