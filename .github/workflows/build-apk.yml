name: Build Cronograma de Estudos APP — Usuários
on:
  push:
    paths:
      - 'android/**'
      - 'payload/**'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble authenticated HTML
        env:
          SUPABASE_URL: https://vcdfemnfpaowoiuyjrgl.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_15jeLJhkInqsK0Doj3lyGw_2XY0WLR8
        run: |
          mkdir -p android/app/src/main/assets
          cat payload/cronograma.part*.b64 > /tmp/cronograma.b64
          base64 -d /tmp/cronograma.b64 | gunzip > android/app/src/main/assets/cronograma.html
          python tools/reorganize_schedule.py
          python android/patch_pending.py
          python tools/inject_auth_cloud.py
          test -s android/app/src/main/assets/cronograma.html
          grep -q 'Acesso pessoal' android/app/src/main/assets/cronograma.html
          grep -q 'user_progress' android/app/src/main/assets/cronograma.html
          grep -q 'Pendências acumuladas' android/app/src/main/assets/cronograma.html
          grep -q 'function accumulatedPending' android/app/src/main/assets/cronograma.html
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload authenticated APK
        uses: actions/upload-artifact@v4
        with:
          name: Cronograma-de-Estudos-APP-USUARIO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Rebuild after launcher activity package fix
