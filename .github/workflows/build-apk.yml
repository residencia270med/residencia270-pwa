name: Build Cronograma de Estudos APP APK
on:
  push:
    paths:
      - 'android/**'
      - 'payload/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble final HTML
        run: |
          mkdir -p android/app/src/main/assets
          cat payload/cronograma.part*.b64 > /tmp/cronograma.b64
          base64 -d /tmp/cronograma.b64 | gunzip > android/app/src/main/assets/cronograma.html
          test -s android/app/src/main/assets/cronograma.html
          grep -q 'Dia 1 de 200' android/app/src/main/assets/cronograma.html || true
          grep -q 'Cronograma de Estudos APP' android/app/src/main/assets/cronograma.html || true
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cronograma-de-Estudos-APP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
