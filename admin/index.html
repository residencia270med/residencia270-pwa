<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Cronograma de Estudos APP</title><style>body{margin:0;background:#06100c;color:#eefaf2;font-family:system-ui,Arial;padding:20px}.box{max-width:1050px;margin:auto;background:#0b1712;border:1px solid #28583f;border-radius:20px;padding:20px}input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #28583f}input{background:#07120d;color:#fff;width:100%;box-sizing:border-box}button{background:#13261b;color:#d8f7e4;cursor:pointer}button.primary{background:#31d27c;color:#06100c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #1b3528;text-align:left}.muted{color:#91aa9b;font-size:12px}.msg{margin-top:10px;color:#8cf5b6}</style></head><body><div class="box"><h1>👑 Administração</h1><p class="muted">Controle de acesso do Cronograma de Estudos APP. Este painel não exibe progresso, desempenho ou conteúdo estudado pelos usuários.</p><section id="login"><h2>Entrar</h2><input id="email" type="email" placeholder="E-mail do administrador"><br><br><input id="password" type="password" placeholder="Senha"><br><br><button class="primary" onclick="login()">Entrar</button><div id="loginMsg" class="msg"></div></section><section id="panel" style="display:none"><button onclick="logout()">Sair</button><h2>➕ Criar acesso</h2><div class="grid"><input id="name" placeholder="Nome"><input id="username" placeholder="Usuário"><input id="newpass" type="password" placeholder="Senha (mín. 8 caracteres)"></div><br><button class="primary" onclick="createUser()">Criar usuário</button><div id="msg" class="msg"></div><h2>👥 Usuários</h2><table><thead><tr><th>Nome</th><th>Usuário</th><th>Status</th><th>Último acesso</th><th></th></tr></thead><tbody id="users"></tbody></table></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://vcdfemnfpaowoiuyjrgl.supabase.co',KEY='sb_publishable_15jeLJhkInqsK0Doj3lyGw_2XY0WLR8';const sb=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);async function boot(){const {data}=await sb.auth.getSession();if(data.session)show()}function show(){$('login').style.display='none';$('panel').style.display='block';load()}async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='Acesso administrativo inválido.';return}show()}async function logout(){await sb.auth.signOut();location.reload()}async function load(){const {data,error}=await sb.from('admin_user_list').select('*').order('display_name');$('users').innerHTML=error?'<tr><td colspan="5">Erro ao carregar.</td></tr>':(data||[]).map(u=>`<tr><td>${esc(u.display_name)}</td><td>${esc(u.username)}</td><td>${u.is_active?'🟢 Ativo':'🔴 Bloqueado'}</td><td>${u.last_login_at?new Date(u.last_login_at).toLocaleString('pt-BR'):'—'}</td><td><button onclick="toggle('${u.id}',${!u.is_active})">${u.is_active?'Bloquear':'Ativar'}</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhum usuário.</td></tr>'}async function toggle(id,active){const {error}=await sb.rpc('admin_set_user_active',{target_user_id:id,active});$('msg').textContent=error?error.message:'Status atualizado.';load()}async function createUser(){const name=$('name').value.trim(),username=$('username').value.trim().toLowerCase(),password=$('newpass').value;if(!name||!username||password.length<8){$('msg').textContent='Preencha os dados corretamente.';return}const {data,error}=await sb.functions.invoke('admin-create-user',{body:{name,username,password}});$('msg').textContent=error?(data?.error||error.message):'Usuário criado.';if(!error){$('name').value='';$('username').value='';$('newpass').value='';load()}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}boot()</script></body></html>
